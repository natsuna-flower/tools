<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>予約管理</title>
<style>
  body {
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    padding: 16px; max-width: 560px; margin: 0 auto;
    color: #3D3230; background: #FBF7F4;
  }
  h1 { font-size: 18px; margin: 0 0 14px; }
  .hint { font-size: 12px; color: #8A7A72; }

  /* パスワード画面 */
  #loginBox { text-align: center; padding-top: 60px; }
  #loginBox input {
    width: 100%; padding: 12px; font-size: 16px; box-sizing: border-box;
    border: 1px solid #DDD3CC; border-radius: 6px; margin: 14px 0; text-align: center;
  }
  #loginBox button, .refreshBtn {
    width: 100%; padding: 13px; font-size: 15px; font-weight: bold;
    background: #C9A227; color: #fff; border: none; border-radius: 8px; cursor: pointer;
  }
  #loginError { color: #d33; font-size: 13px; min-height: 18px; margin-top: 4px; }

  /* 一覧 */
  .topBar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .refreshBtn { width: auto; padding: 8px 14px; font-size: 13px; }
  #list { display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: #fff; border: 1px solid #E8DFD8; border-radius: 10px; padding: 14px;
  }
  .card .row1 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .name { font-weight: bold; font-size: 15px; }
  .badge {
    font-size: 12px; font-weight: bold; padding: 3px 10px; border-radius: 20px; color: #fff;
    white-space: nowrap;
  }
  .badge.pending, .badge.受付 { background: #C9A227; }
  .badge.確定 { background: #2e9e5b; }
  .badge.キャンセル { background: #b33; }
  .meta { font-size: 13px; color: #6b5f58; line-height: 1.6; }
  .meta b { color: #3D3230; }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .actions button {
    flex: 1; min-width: 100px; padding: 10px; font-size: 13px; font-weight: bold;
    border: none; border-radius: 6px; cursor: pointer;
  }
  .btnConfirm { background: #2e9e5b; color: #fff; }
  .btnCancel { background: #b33; color: #fff; }
  .btnConfirm:disabled, .btnCancel:disabled { background: #ddd; color: #999; }
  .checks { display: flex; gap: 16px; margin-top: 10px; font-size: 13px; }
  .checks label { display: flex; align-items: center; gap: 5px; }
  #empty, #loadError { text-align: center; color: #8A7A72; padding: 40px 0; }
  #loadError { color: #d33; }
</style>
</head>
<body>

<div id="loginBox">
  <h1>予約管理ページ</h1>
  <p class="hint">パスワードを入力してください</p>
  <input type="password" id="pwInput" placeholder="パスワード" inputmode="text">
  <button id="loginBtn">開く</button>
  <div id="loginError"></div>
</div>

<div id="mainBox" style="display:none">
  <div class="topBar">
    <h1 style="margin:0">予約一覧</h1>
    <button class="refreshBtn" id="refreshBtn">更新</button>
  </div>
  <div id="list"></div>
  <div id="empty" class="hidden" style="display:none">予約がありません</div>
  <div id="loadError" style="display:none"></div>
</div>

<script>
(function () {
  var el = function (id) { return document.getElementById(id); };
  var q = function (k) {
    var m = location.search.match(new RegExp('[?&]' + k + '=([^&]*)'));
    return m ? decodeURIComponent(m[1]) : '';
  };

  var GAS_URL = q('g');
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(GAS_URL)) {
    document.body.innerHTML = '<p style="text-align:center;padding-top:60px;color:#d33">リンクが正しくありません。</p>';
    return;
  }

  var PW = sessionStorage.getItem('admin_pw') || '';

  function jsonp(params, cb) {
    var name = '__cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    window[name] = function (res) {
      delete window[name];
      script.remove();
      cb(res);
    };
    var qs = Object.keys(params).map(function (k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }).join('&');
    var script = document.createElement('script');
    script.src = GAS_URL + '?' + qs + '&callback=' + name;
    script.onerror = function () { delete window[name]; cb({ ok: false, error: '通信に失敗しました。' }); };
    document.body.appendChild(script);
  }

  function post(payload, cb) {
    fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'admin_update', payload: payload })
    })
      .then(function (r) { return r.json(); })
      .then(cb)
      .catch(function () { cb({ ok: false, error: '通信に失敗しました。' }); });
  }

  el('loginBtn').addEventListener('click', tryLogin);
  el('pwInput').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') tryLogin();
  });

  function tryLogin() {
    var pw = el('pwInput').value.trim();
    if (!pw) return;
    el('loginError').textContent = '';
    el('loginBtn').disabled = true;
    jsonp({ api: 'admin_list', pw: pw }, function (res) {
      el('loginBtn').disabled = false;
      if (!res.ok) {
        el('loginError').textContent = res.error || 'パスワードが違います。';
        return;
      }
      PW = pw;
      sessionStorage.setItem('admin_pw', pw);
      el('loginBox').style.display = 'none';
      el('mainBox').style.display = 'block';
      render(res.reservations);
    });
  }

  el('refreshBtn').addEventListener('click', load);

  function load() {
    jsonp({ api: 'admin_list', pw: PW }, function (res) {
      if (!res.ok) {
        el('loginBox').style.display = 'block';
        el('mainBox').style.display = 'none';
        return;
      }
      render(res.reservations);
    });
  }

  // 既にパスワードを保持していれば、入力画面を飛ばして開く
  if (PW) {
    jsonp({ api: 'admin_list', pw: PW }, function (res) {
      if (res.ok) {
        el('loginBox').style.display = 'none';
        el('mainBox').style.display = 'block';
        render(res.reservations);
      }
    });
  }

  function statusClass(s) { return s === '確定' ? '確定' : (s === 'キャンセル' ? 'キャンセル' : 'pending'); }

  function render(list) {
    var host = el('list');
    host.innerHTML = '';
    el('empty').style.display = (list && list.length) ? 'none' : 'block';

    (list || []).forEach(function (r) {
      var card = document.createElement('div');
      card.className = 'card';

      var status = r['ステータス'] || '受付';
      var payment = r['お支払い方法'] || r['支払方法'] || '';

      card.innerHTML =
        '<div class="row1">' +
          '<div class="name">' + esc(r['ご注文者お名前']) + '</div>' +
          '<div class="badge ' + statusClass(status) + '">' + esc(status || '受付') + '</div>' +
        '</div>' +
        '<div class="meta">' +
          '<b>' + esc(r['受付タイプ'] || '') + '</b>　' + esc(r['到着・来店日'] || '') + ' ' + esc(r['時間帯'] || '') + '<br>' +
          esc(r['花の種類'] || '') + (r['ご予算'] ? '（' + esc(r['ご予算']) + '）' : '') + '<br>' +
          '電話: ' + esc(r['電話番号'] || '') + (payment ? '　支払: ' + esc(payment) : '') +
          (r['メモ'] ? '<br>メモ: ' + esc(r['メモ']) : '') +
        '</div>' +
        '<div class="actions">' +
          '<button class="btnConfirm" data-act="confirm">確定にする</button>' +
          '<button class="btnCancel" data-act="cancel">キャンセルにする</button>' +
        '</div>' +
        '<div class="checks">' +
          '<label><input type="checkbox" data-act="shipped" ' + (truthy(r['発送済み']) ? 'checked' : '') + '> 発送済み</label>' +
          '<label><input type="checkbox" data-act="pickedup" ' + (truthy(r['お渡し済み']) ? 'checked' : '') + '> お渡し済み</label>' +
        '</div>';

      if (status === '確定') card.querySelector('.btnConfirm').disabled = true;
      if (status === 'キャンセル') { card.querySelector('.btnConfirm').disabled = true; card.querySelector('.btnCancel').disabled = true; }

      card.querySelector('.btnConfirm').addEventListener('click', function () {
        setStatus(r.id, '確定', null, this);
      });
      card.querySelector('.btnCancel').addEventListener('click', function () {
        var memo = prompt('キャンセルの理由・補足があれば入力してください（空欄でも送信できます）', '');
        if (memo === null) return; // キャンセル操作自体を取りやめ
        setStatus(r.id, 'キャンセル', memo, this);
      });
      card.querySelectorAll('input[type=checkbox]').forEach(function (chk) {
        chk.addEventListener('change', function () {
          var field = this.getAttribute('data-act');
          this.disabled = true;
          post({ pw: PW, id: r.id, field: field, value: this.checked }, function (res) {
            chk.disabled = false;
            if (!res.ok) { alert(res.error || '更新に失敗しました。'); chk.checked = !chk.checked; }
          });
        });
      });

      host.appendChild(card);
    });
  }

  function setStatus(id, value, memo, btn) {
    var card = btn.closest('.card');
    card.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
    post({ pw: PW, id: id, field: 'status', value: value, memo: memo || '' }, function (res) {
      if (!res.ok) {
        alert(res.error || '更新に失敗しました。');
        card.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
        return;
      }
      load();
    });
  }

  function truthy(v) { return v === true || v === 'TRUE' || v === 'true'; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
})();
</script>
</body>
</html>
